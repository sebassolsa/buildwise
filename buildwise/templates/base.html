<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BuildWise - PC Hardware{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Hojas de estilo unificada -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body class="bg-dark text-light">

    <!-- Header / Navbar Unificada -->
    <nav class="navbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="brand-logo" href="{{ url_for('index') }}">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text">Build<span>Wise</span></div>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link-custom {% if request.endpoint in ['index', 'inicio'] %}active{% endif %}" href="{{ url_for('index') }}">Inicio</a>
                <a class="nav-link-custom {% if request.endpoint == 'catalogo' %}active{% endif %}" href="{{ url_for('catalogo') }}">Catálogo</a>
                <a class="nav-link-custom {% if request.endpoint == 'asesor' %}active{% endif %}" href="{{ url_for('asesor') }}">Asistente de Armado</a>
                <a class="nav-link-custom btn-lista-nav {% if request.endpoint == 'lista_ver' %}active{% endif %}" href="{{ url_for('lista_ver') }}">Mi Lista</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal dinámico -->
    <main class="container my-5 min-vh-100">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Unificado -->
    <footer class="text-center py-4 text-muted small border-top border-secondary mt-auto" style="border-color: var(--border-color) !important;">
        © BuildWise - Herramienta de Compatibilidad de PC Hardware
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
